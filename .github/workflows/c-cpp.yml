name: Sync Upstream and Build C++ Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Sync upstream via Merge
        id: sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://gitgud.io/rewio/S4A12ClientPatch.git || true
          git fetch upstream
          
          UPSTREAM_BRANCH=$(git symbolic-ref refs/remotes/upstream/HEAD 2>/dev/null | sed 's@^refs/remotes/upstream/@@' || echo "")
          if [ -z "$UPSTREAM_BRANCH" ]; then
            if git show-ref --verify --quiet refs/remotes/upstream/main; then
              UPSTREAM_BRANCH="main"
            else
              UPSTREAM_BRANCH="master"
            fi
          fi
          
          echo "Merging from upstream/$UPSTREAM_BRANCH"
          BEFORE_COMMIT=$(git rev-parse HEAD)
          
          git merge "upstream/$UPSTREAM_BRANCH" --no-edit --allow-unrelated-histories || echo "Merge completed or already up to date."
          
          AFTER_COMMIT=$(git rev-parse HEAD)
          
          if [ "$BEFORE_COMMIT" != "$AFTER_COMMIT" ]; then
            echo "Updates found. Pushing merge commit..."
            git push origin HEAD:${{ github.ref }}
            echo "HAS_UPDATE=true" >> $GITHUB_ENV
          else
            echo "No updates from upstream."
            echo "HAS_UPDATE=false" >> $GITHUB_ENV
          fi

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected. Forcing build and release."
            echo "HAS_UPDATE=true" >> $GITHUB_ENV
          fi

      - name: Setup MSBuild (VS2022)
        if: env.HAS_UPDATE == 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Build C++ Projects (sln/vcxproj)
        if: env.HAS_UPDATE == 'true'
        shell: pwsh
        run: |
          $slns = Get-ChildItem -Path . -Filter *.sln -Recurse
          $projs = Get-ChildItem -Path . -Filter *.vcxproj -Recurse
          
          $buildFiles = if ($slns.Count -gt 0) { $slns } else { $projs }
          
          if ($buildFiles.Count -eq 0) {
            Write-Error "No .sln or .vcxproj files found."
            exit 1
          }

          foreach ($file in $buildFiles) {
            Write-Host "Building $($file.FullName)..."
            $platform = if ($file.Extension -eq '.sln') { 'x86' } else { 'Win32' }
            
            msbuild $file.FullName /p:Configuration=Release /p:Platform=$platform /m /v:minimal
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Build failed for $($file.FullName)"
              exit 1
            }
          }

      - name: Setup MSVC Dev Cmd (x86)
        if: env.HAS_UPDATE == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build Az DLL via cl.exe
        if: env.HAS_UPDATE == 'true'
        shell: cmd
        run: |
          cd Az
          cl /LD /EHsc /O2 az.cpp /link user32.lib psapi.lib

      - name: Package DLLs
        if: env.HAS_UPDATE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./publish
          
          # 查找 Release 目录下的 DLL，以及 Az 目录下生成的 DLL，并排除系统运行库
          $dlls = Get-ChildItem -Path . -Recurse -Filter *.dll | Where-Object { 
            ($_.DirectoryName -match 'Release' -or $_.DirectoryName -match '\\Az$') -and 
            $_.Name -notmatch '^(vcruntime|msvcp|ucrt|concrt|vccorlib|msvcr|api-ms)' 
          }
          
          if ($dlls.Count -eq 0) {
            Write-Warning "No target DLLs found."
          }
          
          Write-Host "Found $($dlls.Count) target DLLs:"
          $dlls | ForEach-Object { 
            Write-Host $_.FullName
            Copy-Item $_.FullName -Destination ./publish/ -Force
          }
          
          Compress-Archive -Path ./publish/* -DestinationPath ./S4A12ClientPatch-Release.zip -Force

      - name: Create GitHub Release
        if: env.HAS_UPDATE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: S4A12ClientPatch-Release.zip
          tag_name: build-${{ github.run_number }}
          name: Release Build ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
